<!DOCTYPE html>
<html>
<head>
  <title>Mobile Notification Test</title>
</head>
<body>
    <button onclick="notifyMe()">Send Notification</button>

    <script>
    async function notifyMe() {
    if (!('serviceWorker' in navigator)) {
        alert('No Service Worker support');
        return;
    }
    const reg = await navigator.serviceWorker.register('/sw.js');
    const perm = await Notification.requestPermission();
    console.log('Permission:', perm);
    if (perm !== 'granted') return alert('Permission denied');

    reg.showNotification('✅ Hello!', {
        body: 'Notification from Service Worker',
        icon: '/icon.png'
    });
    }
    </script>

</body>
</html>
