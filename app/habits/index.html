<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atomic Habits Tracker</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js', { scope: './' })
        .then(() => console.log('✅ Service Worker registered'))
        .catch(err => console.error('❌ SW registration failed:', err));
    }
  </script>
  <script defer src="main.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dark-toggle" onclick="toggleDarkMode()" id="darkToggle">🌙</div>
  <h1>Atomic Habits Tracker</h1>
  <div class="habit-form">
    <input type="text" id="habit-input" placeholder="New Habit" />
    <input type="time" id="habit-time" />
    <button onclick="addHabit()">Add Habit</button>
  </div>
  <div class="day-toggle" id="day-toggle"></div>
  <div class="habit-list" id="habit-list"></div>
</body>
</html>
